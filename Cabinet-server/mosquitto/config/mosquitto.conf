# Escuchar en el puerto estándar 1883 en todas las interfaces de red
listener 1883 0.0.0.0

# Permitir conexiones sin usuario/contraseña (solo para desarrollo local)
allow_anonymous true

# Configuración de persistencia y logs
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout