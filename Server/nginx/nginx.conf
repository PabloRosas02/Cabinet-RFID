
#user nginx;
worker_processes auto;
worker_rlimit_nofile 1024;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octect-stream;

  proxy_cache_path /var/cache/nginx/api_cache
                   levels=1:2
                   keys_zone=api_cache:100m
                   max_size=1g
                   inactive=12h
                   use_temp_path=off;

  server_tokens off;
 
  sendfile on;
  tcp_nopush off;
  tcp_nodelay on;
  client_max_body_size 10M;
  client_body_buffer_size 128k;
  client_header_buffer_size 1k;
  large_client_header_buffers 2 1k;

  open_file_cache max=1000 inactive=20s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_disable "msie6";
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/xml+rss
             application/rss+xml application/atom+xml
             image/svg+xml text/x-js text/x-cross-domain-policy;

  resolver 127.0.0.11 valid=30s;
  log_format minimal '$remote_addr $time_local "$request" $status';

  set_real_ip_from  172.16.0.0/12;
  real_ip_header    X-Forwarded-For;
  real_ip_recursive on;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/dist;
    index index.html;

    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log minimal;

    set $backend_sv http://backend:3000;

    # Include all server blocks
    include /etc/nginx/conf.d/backend.conf;
    include /etc/nginx/conf.d/frontend.conf;
  }
}
