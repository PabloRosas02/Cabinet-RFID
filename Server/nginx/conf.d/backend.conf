
location ~* ^/api/servers/(ids|basic-info|addit-info|rules-info)$ {
  include /etc/nginx/conf.d/backend-headers.conf;
  include /etc/nginx/conf.d/backend-cache.conf;
}

location ~* ^/api/servers/([a-zA-Z0-9_-]+)/(basic-info|addit-info|rules-info) {
  include /etc/nginx/conf.d/backend-headers.conf;
  include /etc/nginx/conf.d/backend-cache.conf;
}

location ~* ^/api/servers/ {
  include /etc/nginx/conf.d/backend-headers.conf;
  include /etc/nginx/conf.d/backend-cache.conf;
}

location /api/admin/purge/ {
  allow 172.16.0.0/12;
  allow 10.0.0.0/8;
  deny all;
  
  if ($http_x_purge_token != "mi-token-secreto-123") {
      return 403;
  }
  
  #proxy_cache_purge api_cache "$scheme$host$request_uri";
  access_log /var/log/nginx/purge.log;
  return 204;
}

location /api/ {
  include /etc/nginx/conf.d/backend-headers.conf;

  add_header Cache-Control "no-cache, no-store, must-revalidate, private";
  expires -1;

  proxy_buffering on;
  proxy_buffer_size 64k;
  proxy_buffers 64 512k;
  proxy_busy_buffers_size 1024k;
  proxy_temp_file_write_size 1024k;
  client_max_body_size 60m;

  proxy_connect_timeout 30s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  proxy_no_cache 1;
  proxy_cache_bypass 1;
}
