name: rfid-cabinet-system

x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - default
    - rfid_internal
services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: rfid_mqtt_broker
    profiles: ["dev", "prod"]
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  backend:
    container_name: rfid_backend
    profiles: ["dev", "prod"]
    env_file:
      - .env
    depends_on:
      - mosquitto
    <<: *backend-base

  frontend-dev:
    container_name: rfid_frontend_dev
    profiles: ["dev"]
    build:
      context: ./Front-cabinet
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./Front-cabinet:/app 
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default

  frontend-prod:
    container_name: rfid_frontend_prod
    profiles: ["prod"]
    build:
      context: ./Front-cabinet
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/tmp/nginx_cache
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default

  ngrok-tunnel:
    image: ngrok/ngrok:alpine
    container_name: rfid_ngrok_tunnel
    profiles: ["prod"]
    restart: unless-stopped
    command: 
      - "http"
      - "frontend-prod:80"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_TOKEN}
    depends_on:
      - frontend-prod

volumes:
  frontend_node_modules:
  mosquitto_data:
  mosquitto_log:
  nginx_cache:

networks:
  rfid_internal:
    driver: bridge
  default:
    name: rfid_external
    driver: bridge